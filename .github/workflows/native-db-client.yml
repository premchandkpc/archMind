name: CivilMind Native DB Python Client

on:
  push:
    branches: [main, "feat/civilmind-go-native-db"]
    paths:
      - "civilmind/vector/native_db_store.py"
      - "civilmind/settings.py"
      - "civilmind/events/handlers.py"
      - "civilmind/events/workers.py"
      - "civilmind/tools/vector_search.py"
      - "civilmind/api/app.py"
      - "tests/test_native_db_client.py"
      - ".github/workflows/native-db-client.yml"
  pull_request:
    paths:
      - "civilmind/vector/native_db_store.py"
      - "civilmind/settings.py"
      - "civilmind/events/handlers.py"
      - "civilmind/events/workers.py"
      - "civilmind/tools/vector_search.py"
      - "civilmind/api/app.py"
      - "tests/test_native_db_client.py"
      - ".github/workflows/native-db-client.yml"

permissions:
  contents: read

jobs:
  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client test dependencies
        run: python -m pip install "httpx>=0.27.0" "structlog>=24.0.0" "pydantic>=2.8.0" "pydantic-settings>=2.5.0" "qdrant-client>=1.9.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
      - name: Run native DB client tests
        run: python -m pytest tests/test_native_db_client.py -v
      - name: Compile integrated Python modules
        run: python -m compileall -q civilmind/vector/native_db_store.py civilmind/events/handlers.py civilmind/events/workers.py civilmind/tools/vector_search.py civilmind/api/app.py
