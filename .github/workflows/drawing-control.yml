name: PDF drawing control checks

on:
  pull_request:
    paths:
      - "civilmind/drawing_control/**"
      - "civilmind/api/routes/drawing_revisions.py"
      - "tests/test_title_block.py"
      - "tests/test_drawing_revision_api.py"
      - ".github/workflows/drawing-control.yml"
  push:
    branches: ["main", "feat/pdf-first-sheet-control"]
    paths:
      - "civilmind/drawing_control/**"
      - "civilmind/api/routes/drawing_revisions.py"
      - "tests/test_title_block.py"
      - "tests/test_drawing_revision_api.py"
      - ".github/workflows/drawing-control.yml"

jobs:
  pdf-drawing-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install "fastapi>=0.115" "pydantic>=2.8" "pypdf>=5" "python-multipart>=0.0.9" "httpx>=0.27" pytest pytest-asyncio ruff
      - name: Run drawing-control tests
        run: python -m pytest -q tests/test_title_block.py tests/test_drawing_revision_api.py
      - name: Lint changed Python modules
        run: ruff check civilmind/drawing_control civilmind/api/routes/drawing_revisions.py tests/test_title_block.py tests/test_drawing_revision_api.py
