name: CivilMind Native DB

on:
  push:
    branches: [main, "feat/civilmind-go-native-db"]
    paths:
      - "native-db/**"
      - ".github/workflows/native-db.yml"
  pull_request:
    paths:
      - "native-db/**"
      - ".github/workflows/native-db.yml"

permissions:
  contents: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: native-db/go.mod
      - name: Format Go sources and commit formatting
        run: |
          gofmt -w $(find . -name '*.go' -type f)
          cd ..
          if ! git diff --quiet -- native-db; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add native-db
            git commit -m "style(native-db): format Go sources"
            git push
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
